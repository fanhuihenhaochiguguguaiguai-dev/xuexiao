# Substitute the authorized domain and certificate; serve the extracted ZIP at root.
server {
    listen 443 ssl;
    server_name campus.example.cn;
    ssl_certificate /etc/ssl/campus/fullchain.pem;
    ssl_certificate_key /etc/ssl/campus/privkey.pem;
    root /srv/campus;
    index index.html;
    include /etc/nginx/mime.types;
    types { application/wasm wasm; model/gltf-binary glb; }
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    # Mutable release paths: caches revalidate; the service worker keeps offline copies.
    location ~* \.(html|js|json|webmanifest|glb|png|webp|wasm|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
