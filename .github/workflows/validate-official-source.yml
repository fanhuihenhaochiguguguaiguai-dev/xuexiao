name: Official-source-only validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'manifest.json'
      - 'scripts/**'
      - '.github/workflows/validate-official-source.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifests and report scan limits
        run: |
          python scripts/validate_official_data.py
          python scripts/scan_gate.py
